<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 850" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Multiverse data build flow</title>
<desc>Build steps from the geo spine through nonprofit extracts, the nonprofit panel, covariates, the analysis panels, checks and the multiverse run. Accent dashed lines are dependencies declared in pipeline.csv on 2026-11-17 that were previously implicit.</desc>
<style>
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .new { stroke: #D85A30; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .legend { fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .gray rect { fill: #444441; stroke: #B4B2A9; } .gray .th { fill: #F1EFE8; } .gray .ts { fill: #D3D1C7; }
    .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .th { fill: #EEEDFE; } .purple .ts { fill: #CECBF6; }
    .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .th { fill: #E1F5EE; } .teal .ts { fill: #9FE1CB; }
    .coral rect { fill: #712B13; stroke: #F0997B; } .coral .th { fill: #FAECE7; } .coral .ts { fill: #F5C4B3; }
    .arr { stroke: #B4B2A9; } .legend { fill: #D3D1C7; }
  }
</style>
