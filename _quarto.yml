## Replication website (docs/SITE-PLAN.md). Render from the repo root:
##   quarto render          -> _site/
##   quarto preview
## Only the files in `render` are part of the site; notes/, docs/workflow.qmd and the
## SAMI paper are left out. Parts 5-8 include the paper chapters in paper/, rendered as is.
project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - site/00-motivation.qmd
    - site/01-literature.qmd
    - site/02-construction.qmd
    - site/03-files-sources.qmd
    - site/04-workflow.qmd
    - paper/03-multiverse-overview.qmd
    - paper/04-design-decisions.qmd
    - paper/02-variables.qmd
    - paper/01-stylized-facts.qmd
    - site/08-multiverse-run.qmd
    - paper/05-findings.qmd
    - site/09-reconciliation.qmd
    - site/10-next.qmd

website:
  title: "Nonprofit Density: Data and Multiverse"
  repo-url: https://github.com/lecy/multiverse
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  sidebar:
    style: docked
    contents:
      - index.qmd
      - text: "0. Motivation"
        href: site/00-motivation.qmd
      - text: "1. Literature review"
        href: site/01-literature.qmd
      - section: "Data"
        contents:
          - text: "2. Dataset construction"
            href: site/02-construction.qmd
          - text: "3. Files, sources and dictionaries"
            href: site/03-files-sources.qmd
          - text: "4. Workflow code"
            href: site/04-workflow.qmd
      - section: "Multiverse"
        contents:
          - text: "5. Multiverse overview"
            href: paper/03-multiverse-overview.qmd
          - section: "6. Multiverse design"
            contents:
              - text: "Decision cards"
                href: paper/04-design-decisions.qmd
              - text: "Variables and constructs"
                href: paper/02-variables.qmd
              - text: "Multiverse script (runs from data/)"
                href: https://github.com/lecy/multiverse/blob/main/R/multiverse/run_from_release.R
          - text: "7. Stylized facts"
            href: paper/01-stylized-facts.qmd
          - section: "8. Running the multiverse"
            contents:
              - text: "Code and execution"
                href: site/08-multiverse-run.qmd
              - text: "Findings"
                href: paper/05-findings.qmd
      - text: "9. Reconciling the literature"
        href: site/09-reconciliation.qmd
      - text: "10. Where the research goes"
        href: site/10-next.qmd


execute:
  freeze: auto          # pages with R chunks re-run only when their source changes (_freeze/ is committed)

bibliography: references.bib
csl: site/apa.csl
link-citations: true

format:
  html:
    theme: cosmo
    css: site/styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    embed-resources: false
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    fontsize: 1rem
    linestretch: 1.5
